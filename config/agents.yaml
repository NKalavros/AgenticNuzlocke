# Orchestration mode; dual selects independent System 1 and System 2 backends.
# The older cursor/openai_compatible modes remain available via --provider.
provider: dual  # cursor | openai_compatible | dual

# Actor: jev | openai (Responses API) | openai_compatible (Chat Completions) | codex.
# Codex System 1 uses subscription login and requires an explicit model.
# API backends require an explicit model. Keys are environment variable names.
system1:
  provider: jev
  model: jev-latest

# Planner: codex | claude_code | antigravity | gemini_cli | cursor | openai_compatible.
# Google personal subscription: antigravity (agy), default gemini-3.8-flash-low.
# CLI backends use the vendor's own login and credential storage.
# null resolves the vendor default; Codex verifies vision through model/list.
system2:
  provider: codex
  model: null
  timeout_s: 120

# Legacy/provider settings below are retained for backwards compatibility.

cursor:
  api_key_env: CURSOR_API_KEY
  # Fast vision loop; pair with OptMem so short context still retains lessons.
  model: gemini-3.6-flash
  params:
    effort: minimal
  # Local Cursor agent cwd used for each role call (scratch workspace).
  # Leave null to use runs/<run-id>/agent_workspace
  workspace: null
  # Provider-level retries before the orchestrator falls back.
  max_retries: 5
  # Keep one durable Cursor agent; when input context reaches this many tokens,
  # compact a short session summary and recreate with that summary carried forward.
  compact_at_tokens: 250000

# Legacy Cursor model and shared planning cadence/uncertainty settings.
# Swap the model the same way as `cursor.model`. Other options:
#   model: gpt-5.6-sol
#   params: { reasoning: high }
#   model: gemini-3.6-flash
#   params: { effort: low }
planner:
  model: grok-4.7
  params:
    reasoning_effort: high
  # Look at the screenshot again at least this often, and also on scene changes.
  plan_every_s: 45
  # Noul at or above this refreshes the plan before the button press.
  stale_noul: 0.7
  # Choice confidence below this does not execute. Two in a row call the planner.
  confidence_floor: 0.55

# System 1 — TypeSafe Jev. Key is JEV_API_KEY in the environment or .env.
jev:
  api_key_env: JEV_API_KEY
  base_url: https://api.typesafe.ai
  model: jev-latest
  timeout_s: 8

# For later: local Qwen / vLLM / Ollama OpenAI-compatible endpoint
openai_compatible:
  base_url: http://127.0.0.1:8000/v1
  api_key_env: OPENAI_API_KEY
  api_key_default: "not-needed"
  model: qwen3
  temperature: 0.2
  timeout_s: 120
