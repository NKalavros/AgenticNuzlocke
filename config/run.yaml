game: red
observation_mode: human_assist  # strict_visual | human_assist | debug

# When true, role LLMs get the screenshot (+ OptMem) only — no RAM JSON.
# Override: --with-ram / NUZLOCKE_VISION_ONLY=0
vision_only: true

# Reserve Pokémon at cap-1 and above for necessity; routine candy prep stops below it.
# Final Brock/Misty preparation tops every living under-cap party member up to the cap.
level_cap_buffer: 1

# Absolute path to a legally obtained Pokemon Red/Blue ROM (.gb).
# Override with --rom or NUZLOCKE_ROM.
rom_path: /Users/nikolas/Desktop/Projects/260727_AgenticNuzlocke/red-star-2020-08-18.gb

pokemon_agent:
  host: 127.0.0.1
  port: 8766
  # Start pokemon-agent from the orchestrator if not already up.
  auto_start: true
  # Emulator speed while waiting is paused; between actions use this.
  # (Passed through if the server supports it; otherwise dashboard only.)
  speed: 4

control:
  # Poll pokemon-agent /control so dashboard START/PAUSE/STOP works.
  respect_dashboard_control: true
  poll_interval_s: 0.5
  # Logical actions per proposal (walk_*_N macros count as one).
  max_actions_per_proposal: 12
  # Overworld: short real-time bursts; battles up to 4 when input-ready.

# Cadence: minimum wall time per cycle (observe → decide → execute).
# pokemon-agent's emulator only advances inside /action — it is frozen
# between cycles — so this wait never lets the game catch up; it only paces
# the run for a human watching. Text is given time to print by the wait
# frames sent with each page press, not by this.
# No RAM-based readiness gating (joy_ignore/dialog_active can be wrong on
# ROM hacks like Red Star).
# Override: NUZLOCKE_PROMPT_INTERVAL_S=2.0
prompt_interval_s: 0.1
# Tiny gap between successive button presses within a burst.
press_interval_s: 0.1

# OptMem — durable run memory (capped append-only notes file, see
# nuzlocke/memory/optmem.py). Off by default. Turn on with
# NUZLOCKE_MEMORY=1 or enabled: true. Short-term `recent` still goes
# into each prompt either way.
memory:
  enabled: false
  wake_lines: 24
  # Text-only OptMem compression every N prompt cycles (0 = off).
  rollup_every: 25

# Legacy convenience-checkpoint settings. The active RunLoop commits a paired
# emulator/controller checkpoint every completed cycle, including battles,
# regardless of these values. --resume validates checkpoints/current.json.
checkpoint:
  enabled: true
  # Retained for the legacy helper; does not set paired-checkpoint cadence.
  every_steps: 50

milestones:
  - id: leave_pallet
    description: Leave Pallet Town after obtaining a starter
  - id: viridian
    description: Reach Viridian City
  - id: route_1_encounter
    description: Resolve the first legal Route 1 encounter
  - id: brock
    description: Attempt Brock (Pewter Gym)
  - id: misty
    description: Attempt Misty (Cerulean Gym)
  - id: lt_surge
    description: Attempt Lt. Surge (Vermilion Gym)
  - id: erika
    description: Attempt Erika (Celadon Gym)
  - id: koga
    description: Attempt Koga (Fuchsia Gym)
  - id: saber
    description: Attempt Sabrina (Saffron Gym)
  - id: blaine
    description: Attempt Blaine (Cinnabar Gym)
  - id: giovanni
    description: Attempt Giovanni (Viridian Gym)
  - id: elite_four
    description: Challenge the Elite Four
  - id: champion
    description: Defeat the Champion and complete the Pokemon League

rare_candy:
  enabled: true
  source: audited_grant
  rival_level: 8
  first_center_level: 12
  brock_level: 14
  post_brock_level: 18
  misty_level: 21

stop_after: misty
