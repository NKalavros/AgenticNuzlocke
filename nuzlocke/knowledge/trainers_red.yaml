- map_id: 54
  map: Pewter Gym
  trainer: Brock
  boss: brock
  team: [[Geodude, 12], [Onix, 14]]
  avoidable: false
  note: "Rock/Ground. Water, Grass, Fighting, Ground are strong; Fire, Normal, Flying are weak against them. Onix may use BIDE: the damage it takes over the next two or three turns comes back doubled, so a status move or a switch during it is safer than a big hit."

