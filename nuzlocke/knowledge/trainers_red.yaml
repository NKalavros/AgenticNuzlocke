# Trainers and bosses on the way to Misty, from vanilla Pokemon Red (map ids are pokered's,
# see nuzlocke/environment/maps.py). Red Star is a ROM hack and may change teams: in battle the
# enemy read from RAM (wEnemyMon) is the truth, and a mismatch is worth correcting here.
# `avoidable`: whether the path can go around the trainer's line of sight (false = must fight,
# null = not confirmed). Levels are what the level cap in config/rules_red.yaml is built from.

- map_id: 51
  map: Viridian Forest
  trainer: Bug Catcher
  team: [[Weedle, 6], [Caterpie, 6]]
  avoidable: null
- map_id: 51
  map: Viridian Forest
  trainer: Bug Catcher
  team: [[Weedle, 7], [Kakuna, 7], [Weedle, 7]]
  avoidable: null
- map_id: 51
  map: Viridian Forest
  trainer: Bug Catcher Sammy
  team: [[Weedle, 9]]
  avoidable: null
  note: "Met on Red Star in the forest's west corridor (run 20260929-095253-004c14); his Weedle's POISON STING poisoned the lead."

